[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scry-me-a-query"
version = "2.0.0"
description = "A Discord bot that adds multi-card Scryfall search and EDHRec lookups."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "discord.py>=2.7,<3",
    "Pillow>=12.3,<13",
    "python-dotenv>=1.2,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-requests>=2.33",
]

[project.scripts]
scryquery-bot = "main:main"

[tool.setuptools]
py-modules = ["http_client", "main"]

[tool.setuptools.packages.find]
include = ["bot*", "edhrec*", "image_utils*", "scryfall*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # ambiguous unicode in strings (card text and emoji)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.15"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
